
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-load
  namespace: dockeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-load
  template:
    metadata:
      labels:
        app: frontend-load
    spec:
      containers:
        - name: load-generator
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                wget -q -O- http://frontend:8080/ > /dev/null
              done
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 300m
